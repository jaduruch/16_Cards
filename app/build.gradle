plugins { id 'com.android.application' }

android {
    namespace 'ch.cards.sixteen'
    compileSdk 35
    bundle { language { enableSplit = false } }
    defaultConfig {
        applicationId 'ch.cards.sixteen'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
